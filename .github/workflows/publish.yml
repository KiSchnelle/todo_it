name: Publish

# Triggered when a GitHub Release is published (drafts do NOT trigger it).
# Flow: draft a release in the UI → click "Publish release" → this runs.
# workflow_dispatch is kept as an escape hatch and takes the tag as input.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.0.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  # Build every platform VSIX without access to any publishing secret.
  package:
    name: Package ${{ matrix.target }}
    # upload-artifact needs actions: write on top of the workflow's read default.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-26-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          # Alpine reuses the static linux ripgrep binaries.
          - os: ubuntu-latest
            target: alpine-x64
          - os: ubuntu-24.04-arm
            target: alpine-arm64
          # Browser build (vscode.dev / github.dev); loads dist/extension.web.js.
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Fail fast if the tag and package.json disagree (otherwise --skip-duplicate
      # would turn a forgotten version bump into a silent green no-op).
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node -e "const v=require('./package.json').version; const t=process.env.TAG.replace(/^v/,''); if (v!==t) { console.error('tag '+t+' != package.json '+v); process.exit(1); }"
      - run: npm ci
      # vsce package runs `vscode:prepublish` (typecheck + lint + production build).
      - name: Package
        run: npx vsce package --target ${{ matrix.target }} -o todo-it-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: todo-it-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 7

  # One gated job publishes all VSIXs. The `marketplace` environment holds VSCE_PAT / OVSX_PAT,
  # requires a reviewer's approval and only allows v* tags. It runs only if every platform built,
  # and installs dependencies with --ignore-scripts so no package install script sees the tokens.
  publish:
    name: Publish to VS Marketplace and Open VSX
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - name: Publish to VS Marketplace
        run: npx vsce publish --skip-duplicate --packagePath vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Open VSX is the registry for Cursor, Antigravity, Windsurf/Devin Desktop, Kiro, Trae and
      # VSCodium, so a failure here fails the run. Re-running is safe: both steps skip duplicates.
      - name: Publish to Open VSX
        run: |
          for f in vsix/*.vsix; do
            npx ovsx publish "$f" --skip-duplicate
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
